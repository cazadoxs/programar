name: Filtro 400

on:
  push:
    paths:
      - "apps/filtro-400/**"
      - ".github/workflows/filtro-400.yml"
  pull_request:
    paths:
      - "apps/filtro-400/**"
      - ".github/workflows/filtro-400.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filtro-400-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/filtro-400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas, lint y APK de depuración
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filtro-400-informes
          path: |
            apps/filtro-400/app/build/reports/
            apps/filtro-400/core/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: filtro-400-apk-debug
          path: apps/filtro-400/app/build/outputs/apk/debug/*.apk

  servidor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/filtro-400/servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
