name: Apunta Android

on:
  push:
    branches: [ "claude/apunta-**" ]
    paths: [ "apps/apunta/**", ".github/workflows/apunta-android.yml" ]
  pull_request:
    paths: [ "apps/apunta/**", ".github/workflows/apunta-android.yml" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apunta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/apunta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Build release bundle and APK (unsigned unless secrets are set)
        run: ./gradlew --no-daemon bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apunta-reports
          path: |
            apps/apunta/app/build/reports/**
            apps/apunta/app/build/test-results/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: apunta-apk-debug
          path: apps/apunta/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apunta-release
          path: |
            apps/apunta/app/build/outputs/bundle/release/*.aab
            apps/apunta/app/build/outputs/apk/release/*.apk
