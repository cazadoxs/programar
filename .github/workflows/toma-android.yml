name: Toma (Android)

on:
  push:
    paths:
      - "apps/toma/**"
      - ".github/workflows/toma-android.yml"
  pull_request:
    paths:
      - "apps/toma/**"
      - ".github/workflows/toma-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/toma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint and builds
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toma-builds
          path: |
            apps/toma/app/build/outputs/apk/debug/*.apk
            apps/toma/app/build/outputs/bundle/release/*.aab
            apps/toma/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
