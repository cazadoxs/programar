name: Escáner limpio

on:
  push:
    paths: ["apps/escaner-limpio/**", ".github/workflows/escaner-limpio.yml"]
  pull_request:
    paths: ["apps/escaner-limpio/**", ".github/workflows/escaner-limpio.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/escaner-limpio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitarios
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: APK de depuración
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: escaner-limpio-debug-apk
          path: apps/escaner-limpio/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informes
          path: apps/escaner-limpio/app/build/reports/
