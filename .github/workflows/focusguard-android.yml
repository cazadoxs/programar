name: FocusGuard Android

on:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/focusguard-android.yml'
  workflow_dispatch:

concurrency:
  group: focusguard-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK (debug-signed, installable)
        run: ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk FocusGuard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-APK
          path: FocusGuard.apk
