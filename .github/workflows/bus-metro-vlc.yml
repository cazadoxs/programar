name: Bus i Metro VLC

on:
  workflow_dispatch:
  push:
    branches: ['claude/bus-metro-vlc-**']
    paths: ['apps/bus-metro-vlc/**', '.github/workflows/bus-metro-vlc.yml']
  pull_request:
    paths: ['apps/bus-metro-vlc/**', '.github/workflows/bus-metro-vlc.yml']

defaults:
  run:
    working-directory: apps/bus-metro-vlc

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Core tests (unit + live feeds)
        env:
          LIVE_FEEDS: '1'
        run: CORE_ONLY=1 ./gradlew :core:test 2>&1 | tail -120
      - name: Build debug APK, lint and release (R8)
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:assembleRelease --stacktrace 2>&1 | tail -150
      - name: Collect outputs
        if: always()
        run: |
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/*.apk ../../out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk ../../out/ 2>/dev/null || true
          cp -r app/build/reports ../../out/reports 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bus-metro-vlc-apk
          path: out
          retention-days: 14
