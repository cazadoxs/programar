name: bus-metro-vlc probe data sources
on:
  workflow_dispatch:
  push:
    branches: [claude/bus-metro-vlc-8euiqd]
    paths: [.github/workflows/bus-metro-vlc-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          UA="BusMetroVLC-probe/0.2"
          mkdir d && cd d
          CK=https://opendata.vlci.valencia.es/api/3/action
          for q in valenbisi emt fgv metro "transporte"; do echo "== CKAN search $q"; curl -s -m 30 -A "$UA" "$CK/package_search?q=$q&rows=15" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for r in d['result']['results']:
            print('PKG', r['name'], r.get('license_id'), r.get('license_title'))
            for x in r['resources'][:8]: print('   ', x.get('format'), x.get('datastore_active'), x.get('id'), x.get('url'))
          "; done
          echo "== valenbisi datastore"; curl -s -m 30 "$CK/datastore_search?resource_id=6afb29b7-43a6-4887-859d-c7075c69c200&limit=2" | head -c 2500; echo
          echo "== metro mobilitydatabase latest"; curl -sL -m 120 -o metro.zip -w "%{http_code} %{size_download} %{url_effective}\n" "https://files.mobilitydatabase.org/mdb-1054/latest.zip"
          unzip -o -q metro.zip -d metro; wc -l metro/*.txt; for f in metro/*.txt; do echo "-- $f"; head -3 $f; done; head -30 metro/calendar.txt; cat metro/feed_info.txt; cut -d, -f1-9 metro/calendar_dates.txt | tail -5
          curl -s -m 30 "https://api.mobilitydatabase.org/v1/feeds/mdb-1054" | head -c 1500; echo
          echo "== RENFE Valencia"; curl -sL -m 120 -o renfe.zip "https://ssl.renfe.com/ftransit/Fichero_CER_FOMENTO/fomento_transit.zip"; unzip -o -q renfe.zip -d renfe
          grep "^40T" renfe/routes.txt | wc -l; grep "^40T" renfe/trips.txt | head -3; T=$(grep "^40T" renfe/trips.txt | head -1 | cut -d, -f3); grep "^$T," renfe/stop_times.txt | head -40
          grep -c "" renfe/stops.txt; awk -F, '$3>38.8 && $3<40.0 && $4>-1.3 && $4<0.2' renfe/stops.txt | head -80
          head -5 renfe/shapes.txt; grep "^40" renfe/shapes.txt | head -2
          curl -s -m 30 https://gtfsrt.renfe.com/trip_updates.json | grep -o '"tripId": "[^"]*"' | head -40
          echo "== FGV quick"; for u in https://www.metrovalencia.es/ https://geoportal.emtvalencia.es/ https://www.emtvalencia.es/; do curl -s -m 15 -o /dev/null -w "$u %{http_code}\n" $u; done
