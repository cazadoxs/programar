name: Escanea y come

on:
  push:
    paths: ["apps/escanea-y-come/**", ".github/workflows/escanea-y-come.yml"]
  pull_request:
    paths: ["apps/escanea-y-come/**", ".github/workflows/escanea-y-come.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/escanea-y-come
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core unit tests
        run: ./gradlew :core:test --no-daemon
      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Release bundle (unsigned)
        run: ./gradlew :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: escanea-y-come-debug-apk
          path: apps/escanea-y-come/app/build/outputs/apk/debug/*.apk
