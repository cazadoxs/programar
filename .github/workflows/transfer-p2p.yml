name: Pásalo (transfer-p2p)

on:
  push:
    paths:
      - 'apps/transfer-p2p/**'
      - '.github/workflows/transfer-p2p.yml'
  workflow_dispatch:

concurrency:
  group: transfer-p2p-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/transfer-p2p

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/Pasalo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pasalo-Android-APK
          path: apps/transfer-p2p/build/Pasalo.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Instalador .exe (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Versión portable (.zip)
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\installer\Pasalo-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Pasalo-Windows
          path: |
            apps/transfer-p2p/build/installer/Pasalo-Setup.exe
            apps/transfer-p2p/build/installer/Pasalo-portable.zip
